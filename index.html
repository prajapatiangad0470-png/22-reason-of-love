<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Reasons Why I Love You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #18181c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            transition: background-image 0.5s ease-in-out;
            filter: blur(2px);
        }

        .content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        .reason-box {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .btn {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bg-overlay" id="bg"></div>
        <div class="content">
            <h1 id="title">22 Reasons Why I Love You 🤍🧿</h1>
            <div class="reason-box" id="reason">Tap the button to start! ❤️</div>
            <button class="btn" onclick="nextReason()">Next Reason ✨</button>
        </div>
    </div>

    <!-- Music track (Replace with your own mp3 URL) -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const reasons = [
            { text: "1: Your smile 💖😍", bg: "https://picsum.photos/400/800?random=1" },
            { text: "2: Your cute laugh 🥰", bg: "https://picsum.photos/400/800?random=2" },
            { text: "3: Your kindness ❤️🥺", bg: "https://picsum.photos/400/800?random=3" },
            { text: "4: The way you care 🌸", bg: "https://picsum.photos/400/800?random=4" },
            { text: "5: The way you look at me 🥺❤️", bg: "https://picsum.photos/400/800?random=5" },
            { text: "6: Your voice 💕", bg: "https://picsum.photos/400/800?random=6" },
            { text: "7: Your honesty 🤌🥺", bg: "https://picsum.photos/400/800?random=7" },
            { text: "8: Your eyes ✨", bg: "https://picsum.photos/400/800?random=8" },
            { text: "9: How you stay 🫀😍", bg: "https://picsum.photos/400/800?random=9" },
            { text: "10: Your patience 🕊️", bg: "https://picsum.photos/400/800?random=10" },
            { text: "11: Your hug 🫀😭", bg: "https://picsum.photos/400/800?random=11" },
            { text: "12: Your support 🤝", bg: "https://picsum.photos/400/800?random=12" },
            { text: "13: The way you listen 🫶🥺", bg: "https://picsum.photos/400/800?random=13" },
            { text: "14: Your silliness 🤪", bg: "https://picsum.photos/400/800?random=14" },
            { text: "15: Your touch 📑🦋", bg: "https://picsum.photos/400/800?random=15" },
            { text: "16: Your warm heart 🔥", bg: "https://picsum.photos/400/800?random=16" },
            { text: "17: The way you cry 🥺💖", bg: "https://picsum.photos/400/800?random=17" },
            { text: "18: Your random texts 📱", bg: "https://picsum.photos/400/800?random=18" },
            { text: "19: Your late night talks 🤭🥺", bg: "https://picsum.photos/400/800?random=19" },
            { text: "20: How safe I feel with you 🛡️", bg: "https://picsum.photos/400/800?random=20" },
            { text: "21: Your big heart 😍❤️", bg: "https://picsum.photos/400/800?random=21" },
            { text: "22: Just simply EVERYTHING about you! ♾️❤️", bg: "https://picsum.photos/400/800?random=22" }
        ];

        let index = -1;

        function nextReason() {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play().catch(e => console.log(e));
            }

            index = (index + 1) % reasons.length;
            document.getElementById('reason').innerText = reasons[index].text;
            document.getElementById('bg').style.backgroundImage = `url('${reasons[index].bg}')`;
        }
    </script>
</body>
  </html>
